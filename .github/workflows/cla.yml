# Просит каждого нового участника принять CLA.md прямо в pull request.
# Подписи хранятся в ветке cla-signatures этого репозитория.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
        # v2.6.1, закреплено по коммиту: репозиторий action в архиве, обновлений не будет
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/pingvin1337/dubl/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: pingvin1337,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: |
            Спасибо за правку! Прежде чем её влить, нужно принять [соглашение участника (CLA)](https://github.com/pingvin1337/dubl/blob/main/CLA.md). Коротко: права на правку остаются у тебя, а автор проекта может использовать её в том числе под другой лицензией. Всё, что уже вышло под GPL, остаётся под GPL.

            Чтобы принять, напиши в этом PR комментарий ровно с такой строкой:

            Thanks for the contribution! Before merging, please accept the [Contributor License Agreement](https://github.com/pingvin1337/dubl/blob/main/CLA.md) by posting a comment with exactly this line:
          custom-pr-sign-comment: Я прочитал CLA и принимаю его / I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Все участники приняли CLA. Спасибо! / All contributors have signed the CLA.
